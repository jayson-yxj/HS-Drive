<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>M8-J5B 覆盖感知监督</title><style>body{font:16px/1.5 system-ui;background:#eef2f6;color:#163348;margin:24px}main{max-width:1600px;margin:auto}section,.notice{background:white;padding:16px;border-radius:8px;margin:12px 0}.notice{border-left:5px solid #dc9427}label{display:inline-block;margin:6px}select{font:inherit;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.camera{min-width:0}.zoom{grid-column:1/-1}svg{width:100%;cursor:zoom-in}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ccd5df;padding:8px}pre{white-space:pre-wrap}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>M8-J5B · Coverage-Aware Supervision</h1><p class="notice">真实单片段离线诊断。人工审核 Pending / 暂停，未训练。绿色只表示自动正监督诊断资格，不是 Golden GT。紫色局部 Ignore 是二维缺标/不确定证据，不代表三维 Box。红色帧级遮罩表示所有未匹配 Query 禁用负监督：没有安全负区域证书，N=0。</p><section><select id="frame"></select><select id="mode"><option value="rgb">RGB</option><option value="semantic">Semantic</option><option value="instance">Instance</option></select><span id="count"></span><div><label><input id="raw" type="checkbox" checked>全部原始 GT（橙）</label><label><input id="converted" type="checkbox">全部转换 GT（蓝）</label><label><input id="positive" type="checkbox" checked>正监督诊断候选（绿）</label><label><input id="missing" type="checkbox" checked>缺标候选区域</label><label><input id="ignore" type="checkbox" checked>局部 Ignore（紫）</label><label><input id="fallback" type="checkbox" checked>最终负监督：帧级 Ignore</label></div><p>虚线横线标出 PETR 实际裁剪上沿。投影可见不等于遮挡认证；Instance token 不等于 Actor ID。点击相机放大。</p></section><div class="grid" id="views"></div><section><h2>全部车辆/行人训练资格</h2><table><thead><tr><th>Actor</th><th>类别/几何</th><th>正监督诊断资格</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></section></main><script id="payload" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('payload').textContent),$=s=>document.getElementById(s),ns='http://www.w3.org/2000/svg';let index=2;function el(tag,a){let e=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}function box(svg,p,color,id){if(!p||p.status!=='Valid')return;svg.append(el('polygon',{points:p.polygon.map(x=>x.join(',')).join(' '),stroke:color,'stroke-width':3,fill:'none','data-label':id}));let t=el('text',{x:p.bbox_xyxy[0],y:Math.max(22,p.bbox_xyxy[1]-6),fill:color,'font-size':22});t.textContent=id;svg.append(t);}
function render(){const f=data[index];$('count').textContent=`文件 ${f.ordinal} · 正候选 ${f.positive_count} · 实际安全负区域 0`; $('views').replaceChildren();$('rows').replaceChildren();for(const [cam,images]of Object.entries(f.images)){const sec=document.createElement('section');sec.className='camera';const h=document.createElement('h3');h.textContent=cam;sec.append(h);const svg=el('svg',{viewBox:'0 0 1600 900','data-camera':cam});svg.append(el('image',{href:images[$('mode').value],width:1600,height:900}));if($('fallback').checked)svg.append(el('rect',{x:0,y:0,width:1600,height:900,fill:'#ef3333','fill-opacity':.12,'data-layer':'frame-ignore'}));if($('ignore').checked)svg.append(el('image',{href:images.mask,width:1600,height:900,'data-layer':'local-ignore'}));for(const o of f.objects){let v=o.views[cam];if(!v)continue;if($('raw').checked)box(svg,v.raw_projection,'#ff9c24',o.actor_id+' R');if($('converted').checked)box(svg,v.converted_projection,'#00baff',o.actor_id+' C');if($('positive').checked&&o.positive.eligible)box(svg,v.converted_projection,'#0aef83',o.actor_id+' P-diagnostic');}if($('missing').checked)for(const r of f.views.find(x=>x.camera===cam).regions.filter(x=>x.status==='MissingSourceSupportCandidate')){let b=r.bbox_xyxy;svg.append(el('rect',{x:b[0],y:b[1],width:b[2]-b[0],height:b[3]-b[1],fill:'none',stroke:'#fff','stroke-width':2,'data-layer':'missing'}));}svg.append(el('line',{x1:0,x2:1600,y1:280/.88,y2:280/.88,stroke:'#fff','stroke-dasharray':'10 8'}));svg.onclick=()=>sec.classList.toggle('zoom');sec.append(svg);$('views').append(sec);}for(const o of f.objects.filter(x=>['vehicle','walker'].includes(x.source_class))){const tr=document.createElement('tr');for(const value of [o.actor_id,o.source_class+' / '+o.geometry,o.positive.eligible?'诊断可用，训练未授权':'Ignore',o.positive.reasons.join(' / ')]){let td=document.createElement('td');td.textContent=value;tr.append(td);}$('rows').append(tr);}}
data.forEach((f,i)=>$('frame').append(new Option(f.ordinal,i)));$('frame').value=index;$('frame').onchange=()=>{index=Number($('frame').value);render();};for(const id of ['mode','raw','converted','positive','missing','ignore','fallback'])$(id).onchange=render;render();
</script></body></html>
